name: Аудит зависимостей

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '32 4 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Установить зависимости
        run: python -m pip install ".[audit,build]"
      - name: Проверить известные уязвимости Python-зависимостей
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $requirements = Join-Path $env:RUNNER_TEMP 'ucheba-audit.txt'
          python -m pip freeze --all --exclude ucheba-ai | Set-Content -Encoding utf8 $requirements
          python -m pip_audit --strict --disable-pip --no-deps -r $requirements
