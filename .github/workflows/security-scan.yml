name: Аудит зависимостей

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '32 4 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Установить зависимости
        run: python -m pip install -e ".[audit,build]"
      - name: Проверить известные уязвимости Python-зависимостей
        run: python -m pip_audit --strict --skip-editable
